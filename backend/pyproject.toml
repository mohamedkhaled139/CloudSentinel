[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cloudsentinel"
version = "0.1.0"
description = "Self-hosted, vendor-independent infrastructure health and availability intelligence."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "CloudSentinel contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30,<3.0",
  "alembic>=1.13",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3",
  "httpx>=0.27,<1.0",
  "pyjwt>=2.8",
  "cryptography>=42",
  "reportlab>=4.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
cloudsentinel = "cloudsentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cloudsentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF012", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"cloudsentinel/migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["cloudsentinel/migrations/"]

[tool.ruff.lint.pycodestyle]
max-line-length = 125
