name: Feature request
description: Suggest an improvement
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What operational problem are you trying to solve? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this
